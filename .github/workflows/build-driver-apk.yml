name: Build Driver APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Project Structure
        run: |
          mkdir -p www
          echo "<!DOCTYPE html><html><head><title>Driver</title></head><body><h1>Wasselha Driver</h1></body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save
          npm install -D @capacitor/assets
          npm install @onesignal/onesignal-capacitor --legacy-peer-deps || true

      - name: Configure Driver Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wasselha.driver",
            "appName": "وصلها - السائق",
            "webDir": "www",
            "server": {
              "url": "https://driverapp-topaz.vercel.app/",
              "cleartext": false,
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            },
            "plugins": {
              "OneSignal": {
                "appId": "934b56c0-45fc-497a-95d1-baca0a3e6a75"
              }
            }
          }
          EOF

      - name: Add Android Platform & Assets
        run: |
          npx cap add android || true
          mkdir -p assets
          if [ -f "driver-icon.png" ]; then
            cp driver-icon.png assets/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          fi
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

      - name: Build Driver Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasselha-Driver-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
