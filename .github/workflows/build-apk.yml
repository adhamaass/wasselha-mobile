name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install -D @capacitor/assets
          mkdir -p www
          echo "<h1>Wasselha</h1>" > www/index.html
          npx cap add android || true
          mkdir -p assets
          cp icon.png assets/icon.png || cp icon.png assets/logo.png || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasselha-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
